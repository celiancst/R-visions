    <script>
	let chartInstance = null;
let totalErreursCount = 0;
let historiqueReussite = [];

function initChart() {
    const ctx = document.getElementById('progressionChart').getContext('2d');
    chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Réussite (%)',
                data: [],
                borderColor: '#60a5fa',
                backgroundColor: 'rgba(96, 165, 250, 0.15)',
                fill: true,
                tension: 0.3,
                pointRadius: 4,
                pointHoverRadius: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { min: 0, max: 100, grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#94a3b8' } },
                x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } }
            },
            plugins: { legend: { display: false } }
        }
    });
}

function enregistrerResultat(tauxReussite, nombreErreurs) {
    totalErreursCount += nombreErreurs;
    document.getElementById('errorCountDisplay').textContent = totalErreursCount;

    historiqueReussite.push(Math.round(tauxReussite));
    chartInstance.data.labels.push(`Session ${historiqueReussite.length}`);
    chartInstance.data.datasets[0].data.push(Math.round(tauxReussite));
    chartInstance.update();
}

            darkMode: 'class',

                document.getElementById('theme-icon').className = "fa-solid fa-sun text-lg";

        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                icon.className = "fa-solid fa-moon text-lg";
            } else {
                html.classList.add('dark');

            physiologie: {
                nom: "Physiologie", icon: "fa-heartbeat", couleur: "text-pink-500",
                flashcards: [
                    // CHAPITRE 1 : ADAPTATION AUX MILIEUX SPÉCIFIQUES & THERMORÉGULATION
                    { front: "[Ch. 1 - Thermorégulation] Définition de l'homéostasie", back: "Capacité d'un organisme à maintenir son environnement interne stable face à la variabilité extérieure." },
                    { front: "[Ch. 1 - Thermorégulation] Principe de la thermodynamique à l'exercice", back: "100% Énergie chimique = 25% Énergie mécanique + 75% Énergie thermique (chaleur endogène)." },
                    { front: "[Ch. 1 - Thermorégulation] Premiers symptômes d'un échauffement réussi", back: "1. Système sanguin engagé (rougissement des téguments). 2. Dévêtissement." },
                    { front: "[Ch. 1 - Thermorégulation] Thermostat central de l'organisme", back: "L'hypothalamus, qui maintient la température centrale autour de 37°C et évacue le surplus de chaleur vers la peau." },
                    { front: "[Ch. 1 - Thermorégulation] Échange de chaleur par Rayonnement (Radiation)", back: "Échange sans contact direct (infrarouge). Représente 60% des pertes de chaleur au repos à 21°C." },
                    { front: "[Ch. 1 - Thermorégulation] Échange de chaleur par Conduction", back: "Transfert direct de chaleur par contact entre corps/matières (ex: pied du matelot sur le pont, traileur sur sol chaud)." },
                    { front: "[Ch. 1 - Thermorégulation] Échange par Convection (Air vs Eau)", back: "Échange avec un fluide. 25 fois plus important dans l'eau que dans l'air. Neutralité thermique : 25°C (air) et 34°C (eau)." },
                    { front: "[Ch. 1 - Thermorégulation] Évaporation (Sudation)", back: "Passage de l'état liquide à gazeux. Représente 25% des pertes au repos et près de 80% lors de l'exercice." },
                    { front: "[Ch. 1 - Thermorégulation] Règle de l'hygrométrie (>70%)", back: "Dans un air sec au-delà de 70% d'humidité, chaque palier supplémentaire de 5% d'humidité enlève 5% de performance." },
                    { front: "[Ch. 1 - Thermorégulation] Règle de déshydratation et performance", back: "Une perte de 2% d'eau entraîne une baisse de 20% de performance sur un exercice de plus de 30 minutes." },
                    { front: "[Ch. 1 - Thermorégulation] Adaptations au froid (Frisson vs Sans frisson)", back: "Frisson : contractions involontaires convertissant 100% de l'énergie chimique en chaleur. Sans frisson : vasoconstriction cutanée." },
                    { front: "[Ch. 1 - Thermorégulation] Règle de Billat pour le froid", back: "Augmentation de l'apport énergétique de 5% par tranche de 5°C de perte de température réelle inférieure à 10°C." },
                    { front: "[Ch. 1 - Thermorégulation] Limite bénéfique de la chaleur sur les tissus", back: "Jusqu'à 40°C, la chaleur diminue la viscosité, améliore l'élasticité tendineuse et élève la vitesse de conduction nerveuse." },
                    { front: "[Ch. 1 - Thermorégulation] Reponse cardiovasculaire à la chaleur", back: "Priorité à la thermorégulation : forte vasodilatation cutanée au détriment des muscles actifs, provoquant une hausse de la FC." },
                    { front: "[Ch. 1 - Altitude] Méthode LHTH (Live High, Train High)", back: "Vivre et s'entraîner entre 1500m et 2500m pendant 2 à 4 semaines. Acclimatation (8-10j) puis entraînement (14-21j)." },
                    { front: "[Ch. 1 - Altitude] Méthode LHTL (Live High, Train Low)", back: "Vivre entre 2000m et 3000m (idéal 2500m pour l'EPO) et s'entraîner à une altitude < 1500m pendant 3 à 4 semaines." },
                    { front: "[Ch. 1 - Altitude] Méthode LLTH (IHT - Intermittent Hypoxique)", back: "S'entraîner haut (haute intensité) et vivre bas. Augmente la densité musculaire et mitochondriale." },
                    { front: "[Ch. 1 - Altitude] Méthode IHE (Exposition intermittente au repos)", back: "Exposition hypoxique au repos pour stimuler l'EPO (débute après 6h à 2450m). Études récentes : inefficace." },

                    // CHAPITRE 2 : LE MUSCLE ET LA CONTRACTION
                    { front: "[Ch. 2 - Le Muscle] Résistance du tendon", back: "La résistance du tendon est 4 fois supérieure à celle du muscle (sans augmenter de diamètre)." },
                    { front: "[Ch. 2 - Le Muscle] Enveloppes musculaires (Épi / Péri / Endomysium)", back: "Épimysium (entoure le muscle entier), Périmysium (entoure le faisceau), Endomysium (entre les fibres)." },
                    { front: "[Ch. 2 - Le Muscle] Composition de la myofibrille", back: "Filament épais de myosine entouré de 6 filaments fins d'actine (enroulés de tropomyosine avec molécules de troponine)." },
                    { front: "[Ch. 2 - Le Muscle] Définition du sarcomère", back: "Unité contractile délimitée par deux lignes Z (forme les bandes claires I et sombres A du muscle squelettique)." },
                    { front: "[Ch. 2 - Le Muscle] Fibres Lentes (Type I / ST)", back: "Riches en glycogène, enzymes aérobies et mitochondries, couleur rouge, petits motoneurones Alpha à conduction lente/continue." },
                    { front: "[Ch. 2 - Le Muscle] Fibres Rapides (Type II / FT)", back: "Riches en glycogène et enzymes anaérobie, gros motoneurones Alpha à conduction rapide/discontinue (IIA, IIB, IIx)." },
                    { front: "[Ch. 2 - Le Muscle] Évolution des fibres avec l'âge", back: "Avec le vieillissement, les fibres mutent progressivement de Type IIB vers IIA, puis vers le Type I." },
                    { front: "[Ch. 2 - Le Muscle] Plaque motrice et Unité motrice", back: "La plaque motrice libère l'Acétylcholine. L'unité motrice réunit un motoneurone et l'ensemble de ses fibres (jusqu'à 3000)." },
                    { front: "[Ch. 2 - Le Muscle] Rôle du Calcium (Ca2+) dans la contraction", back: "Il entre via l'influx nerveux et se fixe sur la troponine pour démasquer le site actif de l'actine." },
                    { front: "[Ch. 2 - Le Muscle] Rôles clés de l'ATP dans la contraction", back: "1. Libérer la tête de myosine. 2. Permettre son déplacement. 3. Fournir l'énergie mécanique via son hydrolyse." },
                    { front: "[Ch. 2 - Le Muscle] Enzyme de l'hydrolyse de l'ATP", back: "La myosine ATPase, située directement sur la tête de myosine." },
                    { front: "[Ch. 2 - Le Muscle] Chronologie de l'activation musculaire (4 étapes)", back: "1. Influx nerveux (Acétylcholine sur la plaque motrice). 2. Entrée du Ca2+ qui démasque le site actif d'actine. 3. Fixation et bascule des têtes de myosine. 4. Arrêt du signal, retrait du Ca2+ et dissociation." },
                    { front: "[Ch. 2 - Le Muscle] Obstacle à la fixation au repos", back: "Au repos, le site actif de réception situé sur le filament d'actine est masqué par la troponine (liée à la tropomyosine)." },
                    { front: "[Ch. 2 - Le Muscle] Sens de bascule de la tête de myosine", back: "La tête de myosine bascule vers le CENTRE du sarcomère, tractant le filament fin d'actine et provoquant le raccourcissement (tension)." },
                    { front: "[Ch. 2 - Le Muscle] Action exacte de l'ATP pour détacher la myosine", back: "La fixation d'une nouvelle molécule d'ATP sur la tête de myosine permet de la détacher (dissocier) du site actif de l'actine." },
                    { front: "[Ch. 2 - Le Muscle] Éléments nécessaires au basculement de la myosine", back: "L'énergie issue de l'hydrolyse de l'ATP (via la myosine ATPase), en présence d'ions Mg++ et de transporteurs de phosphate." },
                    { front: "[Ch. 2 - Le Muscle] Que se passe-t-il à la fin de l'influx nerveux ?", back: "Le Ca2+ se retire du filament d'actine, le site actif est de nouveau masqué par la troponine et la tête de myosine se dissocie définitivement." },

                    // CHAPITRE 3 : LES SYSTÈMES ÉNERGÉTIQUES (BIOÉNERGÉTIQUE)
                    { front: "[Ch. 3 - Énergie] Anaérobie Alactique (Voie 1 : PCr)", back: "Utilise la Créatine Phosphokinase (ADP + PCr -> ATP + Cr). Puissance : 3 à 5s. Capacité : < 20-30s." },
                    { front: "[Ch. 3 - Énergie] Anaérobie Alactique (Voie 1bis : Myokinase)", back: "Utilise la Myokinase (2 ADP -> ATP + AMP). Débit très élevé (100 kcal/min). Réassort PCr : 50% en 30s, 80% en 2 min." },
                    { front: "[Ch. 3 - Énergie] Rendement de la Glycolyse vs Glycogénolyse", back: "Glycolyse (dégradation glucose) = 2 ATP + 2 lactates. Glycogénolyse (dégradation glycogène) = 3 ATP + 2 lactates." },
                    { front: "[Ch. 3 - Énergie] Origine de l'acidose métabolique", back: "Saturation des transporteurs NAD à forte intensité : les ions H+ ne sont plus pris en charge et provoquent la baisse du pH." },
                    { front: "[Ch. 3 - Énergie] Élimination du Lactate en Récupération Passive", back: "50% en 25 min, 75% en 50 min, 88% en 1h15, 100% en 1h30." },
                    { front: "[Ch. 3 - Énergie] Élimination du Lactate en Récupération Active", back: "50% en 6 min, 75% en 12 min, 100% en 20 min." },
                    { front: "[Ch. 3 - Énergie] Valeur énergétique du Lactate", back: "1 mole de lactate = 23,5 kcal (soit 0,26 kcal par gramme)." },
                    { front: "[Ch. 3 - Énergie] Devenir du Lactate en récupération", back: "Oxydation (~4/5) par muscles squelettiques, myocarde (10%), reins (<10%). Glycogénogenèse (~1/5) par le foie (Cycle de Cori)." },
                    { front: "[Ch. 3 - Énergie] Puissance Anaérobie Lactique (PAL)", back: "Entraînement à 150% VMA (200-350m, 25-50s, récup 3-5min) pour produire le maximum d'acide métabolique." },
                    { front: "[Ch. 3 - Énergie] Capacité Anaérobie Lactique (CAL)", back: "Entraînement à 110-120% VMA (300-500m, 40s-1min30, récup inter-séries 6-12min) pour développer les systèmes tampons." },
                    { front: "[Ch. 3 - Énergie] Rendement de la Lipolyse Aérobie", back: "Dégradation d'un lipide = > 45 ATP. Dégradation complète d'un triglycéride = 130 ATP." },
                    { front: "[Ch. 3 - Énergie] Épuisement et recharge du glycogène", back: "Épuisement total en 1h à 80% VMA (ou 1h30-2h à 75% VMA). Recharge : 50% à la 5ème heure, 100% en 46h." },
                    { front: "[Ch. 3 - Énergie] Seuils Lactiques SL1 et SL2", back: "SL1 (Seuil Aérobie) = 2 mmol/L de sang. SL2 (Seuil Anaérobie) = 4 mmol/L de sang (accumulation de lactate)." },
                    { front: "[Ch. 3 - Énergie] Seuils Ventilatoires SV1 et SV2", back: "SV1 : l'O2 reste dominant (ratio VE/VO2). SV2 : le CO2 devient dominant (ratio VE/VCO2)." },

                    // CHAPITRE 4 : LE CŒUR ET L'ÉLECTROCARDIOGRAMME
                    { front: "[Ch. 4 - Le Cœur] Organisation du Septum", back: "Paroi musculaire étanche divisant le cœur en deux parties autonomes : le cœur droit et le cœur gauche." },
                    { front: "[Ch. 4 - Le Cœur] Trajet du sang vicié (Cœur Droit)", back: "Veines caves (inf/sup) → Oreillette Droite → (Valve tricuspide) → Ventricule Droit → (Valve pulmonaire) → Artère pulmonaire." },
                    { front: "[Ch. 4 - Le Cœur] Trajet du sang oxygéné (Cœur Gauche)", back: "4 Veines pulmonaires → Oreillette Gauche → (Valve mitrale) → Ventricule Gauche → (Valve aortique) → Artère Aorte." },
                    { front: "[Ch. 4 - Le Cœur] Tissu nodal et pacemakers", back: "Nœud Sinusal (pacemaker dans l'OD) → Nœud Auriculo-Ventriculaire (NAV) → Faisceau de His → Réseau de Purkinje." },
                    { front: "[Ch. 4 - Le Cœur] Signification des ondes ECG (P, QRS, T)", back: "Onde P = dépolarisation auriculaire (systole). QRS = dépolarisation ventriculaire (systole). Onde T = repolarisation ventriculaire (diastole)." },
                    { front: "[Ch. 4 - Le Cœur] Intervalle PQ et Onde T atriale", back: "Intervalle PQ : propagation du signal du nœud sinusal au NAV/His. L'onde T atriale (repolarisation des oreillettes) est masquée par QRS/PQ." },
                    { front: "[Ch. 3 - Le Cœur] Nature et structure générale du cœur", back: "Muscle cardiaque (myocarde) formé de 4 cavités (2 oreillettes, 2 ventricules) séparées de façon étanche par le septum." },
                    { front: "[Ch. 3 - Le Cœur] Le Cœur Droit et la Petite Circulation", back: "Gère la circulation pulmonaire. L'oreillette droite reçoit le sang vicié (pauvre en O2, riche en CO2) via les veines caves sup et inf." },
                    { front: "[Ch. 3 - Le Cœur] Valves du Cœur Droit", back: "Valve tricuspide (entre OD et VD) et valve pulmonaire (entre VD et l'artère pulmonaire)." },
                    { front: "[Ch. 3 - Le Cœur] Trajet détaillé du sang dans le Cœur Droit", back: "Veines caves → Oreillette Droite → (systole auriculaire + valve tricuspide) → Ventricule Droit → (systole ventriculaire + valve pulmonaire) → Artère pulmonaire → Poumons." },
                    { front: "[Ch. 3 - Le Cœur] Le Cœur Gauche et la Grande Circulation", back: "Gère la circulation systémique. L'oreillette gauche reçoit le sang oxygéné issu des poumons par 4 veines pulmonaires." },
                    { front: "[Ch. 3 - Le Cœur] Valves du Cœur Gauche", back: "Valve mitrale (entre OG et VG) et valve aortique (entre VG et l'artère aorte)." },
                    { front: "[Ch. 3 - Le Cœur] Trajet détaillé du sang dans le Cœur Gauche", back: "4 Veines pulmonaires → Oreillette Gauche → (orifice mitral) → Ventricule Gauche → (systole ventriculaire + valve aortique) → Artère Aorte → Organismes et tissus." },
                    { front: "[Ch. 3 - Le Cœur] Le Nœud Sinusal", back: "Siégé sur l'oreillette droite près de la veine cave supérieure, c'est le pacemaker physiologique qui déclenche l'impulsion électrique." },
                    { front: "[Ch. 3 - Le Cœur] Le Nœud Auriculo-Ventriculaire (NAV)", back: "Relais et filtre électrique situé à la base des oreillettes et au sommet du septum inter-ventriculaire." },
                    { front: "[Ch. 3 - Le Cœur] Réseau de conduction ventriculaire", back: "Du NAV, l'impulsion se propage par le faisceau de His puis le réseau de Purkinje pour provoquer la contraction des ventricules." },
                    { front: "[Ch. 3 - Le Cœur] Définitions Tachycardie vs Bradycardie", back: "Tachycardie = augmentation de la fréquence cardiaque. Bradycardie = diminution de la fréquence cardiaque." },
                    { front: "[Ch. 3 - Le Cœur] Signification de l'Onde P sur l'ECG", back: "Dépolarisation = contraction (systole) des oreillettes droite et gauche." },
                    { front: "[Ch. 3 - Le Cœur] Signification de l'Intervalle PQ sur l'ECG", back: "Durée de propagation du signal électrique depuis le nœud sinusal jusqu'au NAV et aux faisceaux de His." },
                    { front: "[Ch. 3 - Le Cœur] Signification du complexe QRS sur l'ECG", back: "Dépolarisation = contraction (systole) des ventricules droit et gauche via le réseau de Purkinje." },
                    { front: "[Ch. 3 - Le Cœur] Signification de l'Intervalle ST sur l'ECG", back: "Durée du signal électrique comprise entre la fin du complexe QRS et le début de l'onde T." },
                    { front: "[Ch. 3 - Le Cœur] Signification de l'Onde T sur l'ECG", back: "Repolarisation = relâchement (diastole) des ventricules." },
                    { front: "[Ch. 3 - Le Cœur] Onde T atriale (repolarisation des oreillettes)", back: "Temps de repolarisation (diastole) des oreillettes, physiologiquement masqué sur l'ECG par l'onde PQ / complexe QRS." },
                    { front: "[Ch. 3 - Le Cœur] Mesure de la Fréquence Cardiaque (BPM)", back: "Nombre de cycles PQRST complets par minute (Battements Par Minute)." },

                    { front: "[Ch. 5 - SNA] Différence Système Somatique vs Autonome", back: "Somatique : mouvements volontaires et environnement externe. Autonome : automatique, régule l'homéostasie interne." },
                    { front: "[Ch. 5 - SNA] Vitesse des voies Nerveuse vs Endocrinienne", back: "Voie nerveuse : réponse immédiate (milliseconde). Voie endocrinienne (hormones) : réponse lente (minutes à heures)." },
                    { front: "[Ch. 5 - SNA] Système Parasympathique (TROPHOTROPE)", back: "Freinateur, restaure l'énergie. Libère de l'acétylcholine : diminue la FC, la ventilation et le métabolisme, stimule la digestion." },
                    { front: "[Ch. 5 - SNA] Système Sympathique (ERGOTROPE)", back: "Accélérateur, prépare à l'action. Libère des catécholamines (adrénaline/noradrénaline) : augmente la FC, la vasoconstriction et la glycolyse." },
                    { front: "[Ch. 5 - SNA] Indicateurs de la VFC (Lf et Hl)", back: "Lf = reflet du travail sympathique (dominante si FC augmente). Hl = reflet du travail parasympathique (dominante si FC diminue)." },

        { front: "[CM 1 - Intro] Que montre l'exemple des cadres de la Silicon Valley (New York Times, 2014) ?", back: "Ils limitent fortement l'accès aux écrans/tablettes de leurs enfants (écoles anti-technologies Waldorf) pour préserver la concentration et la créativité (cf. *La fabrique du crétin digital*, Desmurget, 2019)." },

        { front: "[CM 1 - Intro] Définition de la Sociologie (C. Pociello, 1999)", back: "Science prenant pour objet la structure, le fonctionnement et l'évolution historique des sociétés. Elle étudie l'organisation sociale à travers les relations d'attraction (appartenance) et de lutte (distinction/domination)." },
        { front: "[CM 1 - Intro] Définition de l'Anthropologie et ses invariants", back: "Du grec *anthropos* (homme) et *logos* (discours). Étude de l'humain dans sa globalité pour trouver ce qui est commun à tous. Exemple : Claude Lévi-Strauss a montré l'universalité de l'interdit de l'inceste et de la prise en charge des morts." },
        { front: "[CM 1 - Intro] Définition de l'Histoire et sa spécificité (A. Prost)", back: "Compte-rendu raisonné d'une enquête scientifique dans le passé humain (P. Bonnechere, 2008). Antoine Prost (1996) montre que c'est sa **dimension diachronique** (évolution dans le temps) qui la distingue des autres SHS." },
        { front: "[CM 1 - Intro] Définition de la Démographie", back: "Recensement et traitement numérique des populations pour étudier les mécanismes à la base de leur renouvellement (naissances, décès, immigrations, émigrations)." },
        { front: "[CM 1 - Intro] Les deux visages des SHS (J.-C. Kaufmann)", back: "Les chercheurs sont des « experts du social ». Les SHS lient : 1. Une nébuleuse théorique/auteurs (Comte, Durkheim, Bourdieu...) ; 2. L'analyse des faits concrets du quotidien (ex: *La trame conjugale*, 1992, sur le repassage du linge)." },
        { front: "[CM 1 - Intro] Définition du Fait Social", back: "Comportement ou choix influencé par des conventions, des institutions et des rôles sociaux (« expliquer le social par le social »)." },
        { front: "[CM 1 - Intro] Double dimension du corps (D. Le Breton)", back: "1. Dimension physique / dispositions (*hexis* chez Weber / *Körper* chez Husserl).\n2. Dimension symbolique / corps vécu (*ethos* / *Leib*)." },
        { front: "[CM 1 - Intro] Pourquoi dit-on que le corps est un « produit de culture » ?", back: "Parce que le corps n'est pas qu'une résultante génétique/naturelle : la culture encadre le corps, façonne nos perceptions, notre rapport à la beauté, à la taille et à l'alimentation via nos fictions collectives." },
        { front: "[CM 1 - Intro] Pourquoi la sociologie dérange-t-elle (P. Bourdieu, 1980) ?", back: "« Si on est tellement pointilleux avec la sociologie, c'est qu'elle dérange ». Elle dévoile les relations de pouvoir et refuse de penser les déterminations sociales en termes théologiques ou naturels." },
        { front: "[CM 1 - Intro] Quelle est la vision des structures sociales selon Norbert Elias (1991) ?", back: "Les structures sociales, économiques et politiques sont le résultat des interactions et des relations interindividuelles." },

        // --- CM 2 : LES TECHNIQUES DU CORPS ---
        { front: "[CM 2 - Gestes] Prééminence de la main droite (R. Hertz, 1907)", back: "Résulte du dualisme religieux (sacré *dexter* vs profane *sinister*) et non d'une simple supériorité anatomique cérébrale." },
        { front: "[CM 2 - Gestes] Définition des Techniques du corps (M. Mauss, 1934)", back: "Façon dont les hommes, société par société et de façon traditionnelle, savent se servir de leur corps." },
        { front: "[CM 2 - Gestes] Les 3 principes fondamentaux de Mauss", back: "1. Montage physio-psycho-sociologique\n2. Acte efficace (logique pratique)\n3. Acte d'éducation / d'apprentissage." },
        { front: "[CM 2 - Gestes] Transmission des gestes (Mauss)", back: "Combinaison d'un **apprentissage explicite** (volontaire) et du **mimétisme** (imitation prestigieuse inconsciente)." },
        { front: "[CM 2 - Gestes] L'imitation prestigieuse (Mauss)", back: "Reproduction inconsciente ou consciente des gestes d'individus investis d'autorité, de prestige ou de confiance (parents, aînés, champions)." },
        { front: "[CM 2 - Gestes] Techniques du corps vs Techniques sportives (P. Arnaud)", back: "Les techniques du corps sont traditionnelles et quotidiennes. Les techniques sportives sont factices, standardisées et orientées vers la performance." },
        { front: "[CM 2 - Gestes] L'Habitus selon Mauss (1934)", back: "Compétences et habitudes corporelles intériorisées par l'éducation et la vie en société (variations des manières de marcher, s'asseoir, se moucher)." },
        { front: "[CM 2 - Gestes] Les 3 facteurs de variation (Mauss)", back: "Les techniques du corps varient selon le **sexe** (genre), l'**âge** et le **rendement** de l'apprentissage." },
        { front: "[CM 2 - Gestes] Différenciation selon le sexe (Mauss)", back: "L'apprentissage façonne des gestes distincts selon le genre (ex: façons différentes de fermer le poing, de lancer un objet ou de courir)." },
        { front: "[CM 2 - Gestes] Le corps comme « Fait social total »", back: "Le geste corporel est indivisible : il englobe simultanément la biologie (physio), le mental/imitation (psycho) et les normes sociales (socio)." },
        { front: "[CM 2 - Gestes] L'évolution de la nage (Mauss)", back: "Passage historique de la brasse (tête hors de l'eau) au crawl, montrant que les techniques du corps évoluent par diffusion culturelle et recherche d'efficacité." },

{ front: "[CM 3 - Sport] Émergence des sports californiens (Années 1970)", back: "Apparition des sports de glisse et de nature (surf, skate, VTT) portés par la contre-culture hippie et le rejet du cadre fédéral classique." },
{ front: "[CM 3 - Sport] Valeurs des nouvelles pratiques physiques", back: "Recherche de sensations pures, d'autonomie, d'hédonisme, de liberté d'accès et refus de la compétition formelle/institutionnelle." },
{ front: "[CM 3 - Sport] Processus de sportivisation", back: "Récupération institutionnelle et commerciale d'une pratique libre : création de règles, de fédérations, de championnats et intégration aux JO (ex: skate, BMX)." },

        { front: "[CM 4 - Classes] Culture somatique (L. Boltanski, 1971)", back: "Manière d'agir, écoute des sensations/douleurs, verbalisation et distance aux autres propre à chaque groupe social." },

        { front: "[CM 4 - Classes] Définition de l'Habitus (P. Bourdieu)", back: "Système de dispositions durables et transposables intériorisé durant la socialisation, structurant représentations et pratiques." },
        { front: "[CM 4 - Classes] Les 3 habitus de classe (Bourdieu)", back: "1. Dominante : Habitus de distinction (aisance)\n2. Moyenne : Habitus d'ascension (imitation)\n3. Populaire : Habitus de nécessité/utilité." },
        { front: "[CM 4 - Classes] Les 4 types de capitaux (Bourdieu)", back: "1. Économique (revenus)\n2. Culturel (objectivé, institutionnalisé, incorporé)\n3. Social (réseau)\n4. Symbolique (prestige)." },

        // ==========================================
        // GESTION DU FILTRE PAR CHAPITRE
        // ==========================================
        function extraireChapitres(matiere) {
            let chapitres = new Set();
            const regex = /^\[([^\]]+)\]/;
            
            if (matiere.flashcards) {
                matiere.flashcards.forEach(f => {
                    let match = f.front.match(regex);
                    if (match) chapitres.add(match[1].trim());
                });
            }
            if (matiere.qcms) {
                matiere.qcms.forEach(q => {
                    let match = q.question.match(regex);
                    if (match) chapitres.add(match[1].trim());
                });
            }
            return Array.from(chapitres);
        }

        function chargerContenuMatiere() {
            const matiere = appData[matiereActive];
            const listeChapitres = extraireChapitres(matiere);
            const containerFiltre = document.getElementById('container-filtre-chapitre');
            
            if (listeChapitres.length > 0) {
                let options = '<option value="tous">Tout réviser (Mélange global)</option>';
                listeChapitres.forEach(chap => {
                    options += `<option value="${chap}">${chap}</option>`;
                });
                document.getElementById('select-chapitre').innerHTML = options;
                document.getElementById('select-chapitre').value = 'tous';
                chapitreActif = 'tous';
                containerFiltre.classList.remove('hidden');
            } else {
                containerFiltre.classList.add('hidden');
                chapitreActif = 'tous';
            }

            appliquerFiltreChapitre();
        }

        function changerChapitre(valeur) {
            chapitreActif = valeur;
            appliquerFiltreChapitre();
        }

        function appliquerFiltreChapitre() {
            const matiereOriginale = appData[matiereActive];
            
            if (chapitreActif === 'tous') {
                matiereFiltree = { ...matiereOriginale };
            } else {
                const tagRecherche = `[${chapitreActif}]`;
                matiereFiltree = { 
                    ...matiereOriginale,
                    flashcards: matiereOriginale.flashcards ? matiereOriginale.flashcards.filter(f => 
                        f.front.includes(tagRecherche) || f.front.toLowerCase().includes(chapitreActif.toLowerCase())
                    ) : [],
                    qcms: matiereOriginale.qcms ? matiereOriginale.qcms.filter(q => 
                        q.question.includes(tagRecherche) || q.question.toLowerCase().includes(chapitreActif.toLowerCase())
                    ) : []
                };
            }

            chargerFlashcards();
            
            const containerQcms = document.getElementById('container-qcms');
            if (!matiereFiltree.qcms || matiereFiltree.qcms.length === 0) {
                containerQcms.innerHTML = "<p class='italic text-gray-400 mt-6 text-center w-full py-10'>Aucun QCM disponible pour ce module.</p>";
            } else {
                afficherAccueilQCM();
            }
        }

            if (indexFlashcardActive > 0) {
                indexFlashcardActive--;
            } else {
                indexFlashcardActive = matiereFiltree.flashcards.length - 1;

        function lancerSerieQCM(nombreDeQuestions) {
            const containerQcms = document.getElementById('container-qcms');
            
            let qcmsMelanges = [...matiereFiltree.qcms].sort(() => 0.5 - Math.random());
            let qcmsSelectionnes = qcmsMelanges.slice(0, nombreDeQuestions);
            
            let htmlQcms = '<div class="space-y-6">';
            
            htmlQcms += `
                <div class="flex items-center justify-between mb-2">
                    <span class="bg-indigo-100 text-indigo-800 dark:bg-indigo-900 dark:text-indigo-200 text-sm font-bold px-3 py-1 rounded-lg">Série en cours : ${qcmsSelectionnes.length} questions</span>
                </div>
            `;

            qcmsSelectionnes.forEach((qcm, indexQcm) => {
                htmlQcms += `
                <div class="bg-gray-50 dark:bg-gray-900 p-5 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm">
                    <p class="font-bold text-gray-800 dark:text-gray-200 mb-4 text-lg">${indexQcm + 1}. ${qcm.question}</p>
                    <div class="space-y-2">`;
                
                qcm.options.forEach((opt, indexOpt) => {
                    const explicationEscaped = qcm.explanation.replace(/'/g, "\\'");
                    htmlQcms += `
                        <button onclick="verifierQCM(this, ${qcm.correct === indexOpt}, '${explicationEscaped}')" 
                                class="w-full text-left px-5 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-700 hover:bg-indigo-50 dark:hover:bg-gray-800 hover:border-indigo-300 transition bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-medium">
                            ${opt}
                        </button>`;
                });
                
                htmlQcms += `
                    </div>
                    <div class="explication hidden mt-4 p-4 bg-blue-50 dark:bg-blue-900/30 border border-blue-100 dark:border-blue-800 text-blue-800 dark:text-blue-300 rounded-xl text-sm leading-relaxed"></div>
                </div>`;
            });
            
            htmlQcms += `
                <div class="pt-6 mt-6 border-t border-gray-200 dark:border-gray-700 text-center">
                    <button onclick="appliquerFiltreChapitre()" class="bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 font-bold py-3 px-6 rounded-xl transition shadow-sm flex justify-center items-center gap-2 mx-auto">
                        <i class="fa-solid fa-rotate-right"></i> Terminer et relancer une série
                    </button>
                </div>
            `;
            htmlQcms += '</div>';
            
            containerQcms.innerHTML = htmlQcms;
        }

        function verifierQCM(btnElement, isCorrect, explication) {
            const parent = btnElement.parentElement;
            const boutons = parent.querySelectorAll('button');
            
            boutons.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:bg-indigo-50', 'hover:border-indigo-300', 'cursor-pointer');
                b.classList.add('opacity-60', 'cursor-not-allowed');
            });

            btnElement.classList.remove('opacity-60', 'border-gray-200', 'dark:border-gray-700');
            if (isCorrect) {
                btnElement.classList.add('bg-green-100', 'dark:bg-green-900/40', 'border-green-500', 'text-green-900', 'dark:text-green-300', 'font-bold');
                btnElement.innerHTML = '<i class="fa-solid fa-check mr-2"></i> ' + btnElement.innerHTML;
            } else {
                btnElement.classList.add('bg-red-100', 'dark:bg-red-900/40', 'border-red-400', 'text-red-900', 'dark:text-red-300');
                btnElement.innerHTML = '<i class="fa-solid fa-xmark mr-2"></i> ' + btnElement.innerHTML;
            }

            const explicationDiv = parent.nextElementSibling;
            explicationDiv.innerHTML = `<strong><i class="fa-solid fa-lightbulb text-yellow-500 mr-2"></i>Explication :</strong> ${explication}`;
            explicationDiv.classList.remove('hidden');
        }

        // ==========================================
        // GESTION DE L'ÉVALUATION (Schémas Numérotés)
        // ==========================================
        function initialiserSelectSchemas() {
            const schemas = appData[matiereActive].schemas;
            const select = document.getElementById('select-schema');
            select.innerHTML = '';

            if (!schemas || schemas.length === 0) {
                select.innerHTML = '<option value="">Aucun schéma disponible</option>';
                return;
            }

            schemas.forEach((schema, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = schema.titre;
                select.appendChild(option);
            });

            indexSchemaActif = 0;
            select.value = 0;
        }

        function changerSchemaActif(index) {
            indexSchemaActif = parseInt(index);
            reponsesSchemaAffichees = false;
            chargerSchema();
        }

        function toggleReponsesSchema() {
            reponsesSchemaAffichees = !reponsesSchemaAffichees;
            
            const solutions = document.querySelectorAll('.schema-solution');
            solutions.forEach(el => {
                if (reponsesSchemaAffichees) {
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            });
            
            majBoutonsReponses();
        }

        function majBoutonsReponses() {
            const texte = reponsesSchemaAffichees ? "Masquer les réponses" : "Afficher les réponses";
            const icone = reponsesSchemaAffichees ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";

            const btnBottom = document.getElementById('btn-reponses-schema');
            const txtBottom = document.getElementById('texte-btn-reponses');
            const icoBottom = document.getElementById('icone-btn-reponses');
            if (txtBottom) txtBottom.textContent = texte;
            if (icoBottom) icoBottom.className = icone;
            if (btnBottom) {
                if (reponsesSchemaAffichees) {
                    btnBottom.classList.add('bg-indigo-50', 'dark:bg-indigo-900/40');
                } else {
                    btnBottom.classList.remove('bg-indigo-50', 'dark:bg-indigo-900/40');
                }
            }

            const btnTop = document.getElementById('btn-reponses-schema-top');
            const txtTop = document.getElementById('texte-btn-reponses-top');
            const icoTop = document.getElementById('icone-btn-reponses-top');
            if (txtTop) txtTop.textContent = texte;
            if (icoTop) icoTop.className = icone;
            if (btnTop) {
                if (reponsesSchemaAffichees) {
                    btnTop.classList.add('bg-indigo-100', 'dark:bg-indigo-900/60');
                } else {
                    btnTop.classList.remove('bg-indigo-100', 'dark:bg-indigo-900/60');
                }
            }
        }

        function formaterReponsesValides(reponsesValides) {
            if (!reponsesValides || reponsesValides.length === 0) return "";
            const unique = [...new Set(reponsesValides.map(r => r.trim()))];
            const principale = unique[0];
            if (unique.length === 1) {
                return `<strong class="text-emerald-900 dark:text-emerald-300">${principale}</strong>`;
            }
            const variantes = unique.slice(1).join(', ');
            return `<strong class="text-emerald-900 dark:text-emerald-300">${principale}</strong> <span class="text-xs text-emerald-700 dark:text-emerald-400 font-normal">(ou ${variantes})</span>`;
        }

        function chargerSchema() {
            const schemas = appData[matiereActive].schemas;
            const containerLegendes = document.getElementById('schema-legendes-container');
            const imgSchema = document.getElementById('schema-image');
            const placeholder = document.getElementById('schema-placeholder');
            const btnValider = document.getElementById('btn-valider-schema');
            const btnReponses = document.getElementById('btn-reponses-schema');
            const btnReponsesTop = document.getElementById('btn-reponses-schema-top');
            const resultatDiv = document.getElementById('schema-resultat');
            
            reponsesSchemaAffichees = false;
            majBoutonsReponses();

            if (!schemas || schemas.length === 0) {
                document.getElementById('schema-titre').textContent = "Aucun schéma disponible";
                imgSchema.classList.add('hidden');
                placeholder.classList.remove('hidden');
                containerLegendes.innerHTML = "<p class='text-gray-400 italic'>Les champs de réponse apparaîtront ici.</p>";
                btnValider.classList.add('hidden');
                if (btnReponses) btnReponses.classList.add('hidden');
                if (btnReponsesTop) btnReponsesTop.classList.add('hidden');
                resultatDiv.classList.add('hidden');
                return;
            }

            const schemaData = schemas[indexSchemaActif];
            document.getElementById('schema-titre').textContent = schemaData.titre;
            
            imgSchema.src = schemaData.imageUrl;
            imgSchema.classList.remove('hidden');
            placeholder.classList.add('hidden');
            btnValider.classList.remove('hidden');
            if (btnReponses) btnReponses.classList.remove('hidden');
            if (btnReponsesTop) btnReponsesTop.classList.remove('hidden');
            resultatDiv.classList.add('hidden');
            
            containerLegendes.innerHTML = ''; 

            schemaData.legendes.forEach(legende => {
                const div = document.createElement('div');
                div.className = "flex items-start gap-3";
                const reponseAffichee = formaterReponsesValides(legende.reponsesValides);
                div.innerHTML = `
                    <div class="bg-indigo-100 dark:bg-indigo-900/50 text-indigo-800 dark:text-indigo-300 font-bold rounded-full w-8 h-8 flex items-center justify-center flex-shrink-0 shadow-sm border border-indigo-200 dark:border-indigo-800 mt-1">
                        ${legende.numero}
                    </div>
                    <div class="flex-grow">
                        <input type="text" id="reponse-${legende.numero}" 
                               class="w-full border-2 border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition" 
                               placeholder="Légende n°${legende.numero}...">
                        <div id="solution-${legende.numero}" class="schema-solution ${reponsesSchemaAffichees ? '' : 'hidden'} mt-1.5 text-sm bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-300 rounded-lg px-3 py-1.5 flex items-center justify-between gap-2 shadow-xs">
                            <div class="flex items-center gap-2 min-w-0">
                                <i class="fa-solid fa-lightbulb text-amber-500 flex-shrink-0 text-xs"></i>
                                <span class="text-xs sm:text-sm">Réponse : ${reponseAffichee}</span>
                            </div>
                            <button type="button" class="btn-remplir ml-auto text-xs bg-emerald-100 dark:bg-emerald-900/60 hover:bg-emerald-200 dark:hover:bg-emerald-900 text-emerald-800 dark:text-emerald-200 font-medium px-2 py-0.5 rounded transition flex items-center gap-1 flex-shrink-0" title="Remplir ce champ">
                                <i class="fa-solid fa-pen text-[10px]"></i> Remplir
                            </button>
                        </div>
                    </div>
                `;

                const btnRemplir = div.querySelector('.btn-remplir');
                if (btnRemplir) {
                    btnRemplir.addEventListener('click', () => {
                        const input = div.querySelector(`#reponse-${legende.numero}`);
                        if (input) {
                            input.value = legende.reponsesValides[0];
                            input.focus();
                        }
                    });
                }

                containerLegendes.appendChild(div);
            });
        }

        // ==========================================
        // OUTILS DE CORRECTION TOLÉRANTE
        // ==========================================
        function normaliserTexte(texte) {
            return texte.trim()
                        .toLowerCase()
                        .normalize("NFD")
                        .replace(/[\u0300-\u036f]/g, ""); 
        }

        function calculerFautes(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            
            const matrice = [];
            for (let i = 0; i <= b.length; i++) { matrice[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrice[0][j] = j; }
            
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrice[i][j] = matrice[i - 1][j - 1];
                    } else {
                        matrice[i][j] = Math.min(
                            matrice[i - 1][j - 1] + 1, 
                            Math.min(matrice[i][j - 1] + 1, 
                                     matrice[i - 1][j] + 1) 
                        );
                    }
                }
            }
            return matrice[b.length][a.length];
        }

        function validerSchema() {
            const schemaData = appData[matiereActive].schemas[indexSchemaActif];
            if(!schemaData) return;
            
            let score = 0;

            schemaData.legendes.forEach(legende => {
                const inputElement = document.getElementById(`reponse-${legende.numero}`);
                const reponseUser = inputElement.value;
                const reponseUserNorm = normaliserTexte(reponseUser);
                
                const estCorrect = legende.reponsesValides.some(rep => {
                    const repNorm = normaliserTexte(rep);
                    if (repNorm === reponseUserNorm) return true;
                    const nombreFautes = calculerFautes(repNorm, reponseUserNorm);
                    const tolerance = repNorm.length > 6 ? 2 : 1;
                    return nombreFautes <= tolerance;
                });
                
                if (estCorrect) {
                    inputElement.classList.remove('border-gray-200', 'dark:border-gray-700', 'border-red-400', 'bg-red-50', 'text-red-800');
                    inputElement.classList.add('border-green-500', 'bg-green-50', 'dark:bg-green-900/30', 'text-green-800', 'dark:text-green-300', 'font-medium');
                    score++;
                } else {
                    inputElement.classList.remove('border-gray-200', 'dark:border-gray-700', 'border-green-500', 'bg-green-50', 'text-green-800');
                    inputElement.classList.add('border-red-400', 'bg-red-50', 'dark:bg-red-900/30', 'text-red-800', 'dark:text-red-300');
                }
            });

            const resultatDiv = document.getElementById('schema-resultat');
            resultatDiv.classList.remove('hidden', 'bg-green-100', 'dark:bg-green-900/50', 'text-green-800', 'dark:text-green-300', 'bg-orange-100', 'dark:bg-orange-900/50', 'text-orange-800', 'dark:text-orange-300');
            
            if(score === schemaData.legendes.length) {
                resultatDiv.classList.add('bg-green-100', 'dark:bg-green-900/50', 'text-green-800', 'dark:text-green-300');
                resultatDiv.innerHTML = `<i class="fa-solid fa-trophy mr-2"></i> Parfait ! Vous avez ${score}/${schemaData.legendes.length} bonnes réponses.`;
            } else {
                resultatDiv.classList.add('bg-orange-100', 'dark:bg-orange-900/50', 'text-orange-800', 'dark:text-orange-300');
                resultatDiv.innerHTML = `
                    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
                        <span><i class="fa-solid fa-triangle-exclamation mr-2"></i> Vous avez ${score}/${schemaData.legendes.length}. Corrigez les cases rouges ou vérifiez les solutions !</span>
                        <button onclick="if(!reponsesSchemaAffichees) toggleReponsesSchema()" class="text-sm bg-orange-200 dark:bg-orange-900/60 hover:bg-orange-300 dark:hover:bg-orange-900 text-orange-900 dark:text-orange-200 font-bold px-3 py-1.5 rounded-lg transition whitespace-nowrap flex items-center gap-1.5">
                            <i class="fa-solid fa-eye text-xs"></i> Voir les réponses
                        </button>
                    </div>
                `;
            }
        }
    </script>
