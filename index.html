<!DOCTYPE html>
<html lang="fr" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Révisions STAPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: bold; }
        .tab-inactive { color: #6b7280; }
        .tab-inactive:hover { color: #374151; }
        html.dark .tab-active { border-bottom: 4px solid #818cf8; color: #818cf8; }
        html.dark .tab-inactive { color: #9ca3af; }
        html.dark .tab-inactive:hover { color: #e5e7eb; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-screen flex flex-col transition-colors duration-300">

    <!-- EN-TÊTE -->
    <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-10 transition-colors duration-300">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800 dark:text-white">STAPS <span class="text-indigo-600 dark:text-indigo-400">Révisions</span></h1>
            </div>
            
            <div class="flex items-center gap-4">
                <button id="btn-retour" onclick="afficherDashboard()" class="hidden flex items-center gap-2 text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium transition">
                    <i class="fa-solid fa-arrow-left"></i> Retour aux matières
                </button>
                
                <!-- BOUTON MODE SOMBRE -->
                <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-yellow-400 hover:bg-gray-200 dark:hover:bg-gray-600 transition shadow-sm" title="Changer de mode">
                    <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENU PRINCIPAL -->
    <main class="flex-grow overflow-y-auto p-4 md:p-8 max-w-6xl mx-auto w-full">

        <!-- VUE 1 : DASHBOARD -->
        <div id="vue-dashboard" class="block">
            <h2 class="text-xl text-gray-500 dark:text-gray-400 mb-6 font-medium">Choisissez une matière à réviser :</h2>
            <div id="grille-matieres" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
        </div>

        <!-- VUE 2 : MATIÈRE -->
        <div id="vue-matiere" class="hidden">
            
            <div class="flex items-center gap-4 mb-8">
                <i id="matiere-icon" class="fa-solid fa-book text-4xl"></i>
                <h2 id="matiere-titre" class="text-3xl font-bold capitalize">Titre Matière</h2>
            </div>

            <!-- ONGLETS -->
            <div class="flex border-b border-gray-200 dark:border-gray-700 mb-8 overflow-x-auto">
                <button onclick="changerOnglet('apprentissage')" id="onglet-apprentissage" class="tab-active px-6 py-3 text-lg transition-colors duration-200 focus:outline-none whitespace-nowrap">
                    <i class="fa-solid fa-book-open mr-2"></i> Apprentissage
                </button>
                <button onclick="changerOnglet('evaluation')" id="onglet-evaluation" class="tab-inactive px-6 py-3 text-lg transition-colors duration-200 focus:outline-none whitespace-nowrap">
                    <i class="fa-solid fa-pen-to-square mr-2"></i> Évaluation (Schémas)
                </button>
            </div>

            <!-- ONGLET 1 : APPRENTISSAGE -->
            <div id="contenu-apprentissage" class="block">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Flashcards -->
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 transition-colors">
                        <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-clone text-indigo-500"></i> Lexique & Flashcards</h3>
                        <div id="container-flashcards" class="text-gray-500 dark:text-gray-400 italic"></div>
                    </div>
                    <!-- QCM -->
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 transition-colors">
                        <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-list-check text-indigo-500"></i> QCM d'entraînement</h3>
                        <div id="container-qcms" class="text-gray-500 dark:text-gray-400 italic"></div>
                    </div>
                </div>
            </div>

            <!-- ONGLET 2 : ÉVALUATION (Schémas Numérotés) -->
            <div id="contenu-evaluation" class="hidden">
                
                <!-- SÉLECTEUR DE SCHÉMA -->
                <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 transition-colors">
                    <label for="select-schema" class="font-bold text-gray-700 dark:text-gray-300 flex items-center gap-2">
                        <i class="fa-solid fa-filter text-indigo-600 dark:text-indigo-400"></i> Choisir le schéma :
                    </label>
                    <select id="select-schema" onchange="changerSchemaActif(this.value)" class="w-full sm:w-2/3 border-2 border-gray-200 dark:border-gray-700 rounded-xl px-4 py-2 font-medium text-gray-700 dark:text-gray-200 bg-gray-50 dark:bg-gray-900 focus:outline-none focus:border-indigo-500 transition">
                    </select>
                </div>

                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 transition-colors">
                    <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-4" id="schema-titre">Titre du schéma</h3>
                    
                    <div class="flex flex-col md:flex-row gap-8">
                        <!-- Zone Image -->
                        <div class="md:w-1/2 flex justify-center items-start border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-xl p-2 bg-gray-50 dark:bg-gray-900 min-h-[300px] md:sticky md:top-4 self-start">
                            <img id="schema-image" src="" alt="Schéma" class="max-w-full h-auto rounded-lg shadow-sm hidden">
                            <div id="schema-placeholder" class="text-gray-400 flex flex-col items-center justify-center h-full w-full py-20">
                                <i class="fa-regular fa-image text-4xl mb-2"></i>
                                <span>Aucun schéma pour le moment</span>
                            </div>
                        </div>
                        
                        <!-- Zone des réponses numérotées -->
                        <div class="md:w-1/2">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                                <p class="text-gray-500 dark:text-gray-400 text-sm"><i class="fa-solid fa-circle-info mr-2"></i>Remplissez les légendes correspondant aux numéros sur le schéma.</p>
                                <button onclick="toggleReponsesSchema()" id="btn-reponses-schema-top" class="hidden text-sm font-semibold text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 bg-indigo-50 dark:bg-indigo-900/40 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 px-3 py-1.5 rounded-lg border border-indigo-200 dark:border-indigo-800 transition flex items-center gap-1.5 self-start sm:self-auto whitespace-nowrap">
                                    <i class="fa-solid fa-eye" id="icone-btn-reponses-top"></i> <span id="texte-btn-reponses-top">Afficher les réponses</span>
                                </button>
                            </div>
                            
                            <div id="schema-legendes-container" class="space-y-3 mb-6"></div>
                            
                            <div class="flex flex-col sm:flex-row gap-3">
                                <button onclick="validerSchema()" id="btn-valider-schema" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-md flex justify-center items-center gap-2 hidden">
                                    <i class="fa-solid fa-check-circle"></i> Valider mes réponses
                                </button>
                                <button onclick="toggleReponsesSchema()" id="btn-reponses-schema" class="flex-1 bg-white dark:bg-gray-800 hover:bg-indigo-50 dark:hover:bg-gray-700 text-indigo-600 dark:text-indigo-400 border-2 border-indigo-600 dark:border-indigo-500 font-bold py-3 px-4 rounded-xl transition shadow-sm flex justify-center items-center gap-2 hidden">
                                    <i class="fa-solid fa-eye" id="icone-btn-reponses"></i> <span id="texte-btn-reponses">Afficher les réponses</span>
                                </button>
                            </div>
                            <div id="schema-resultat" class="mt-4 text-center font-bold text-lg hidden p-3 rounded-lg"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // ==========================================
        // GESTION DU MODE SOMBRE
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').className = "fa-solid fa-sun text-lg";
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').className = "fa-solid fa-moon text-lg";
            }
            genererDashboard();
            afficherDashboard();
        });

        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                icon.className = "fa-solid fa-moon text-lg";
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                icon.className = "fa-solid fa-sun text-lg";
            }
        }

        // ==========================================
        // BASE DE DONNÉES STAPS
        // ==========================================
        const appData = {
            anatomie: {
                nom: "Anatomie", icon: "fa-bone", couleur: "text-red-500",
                flashcards: [
                    { front: "Détroit supérieur", back: "L'ouverture supérieure du bassin qui délimite le grand et le petit bassin." },
                    { front: "Contre-nutation", back: "Bascule du sacrum où le promontoire sacré s'élève et la pointe du coccyx part en bas et en avant." },
                    { front: "Flexion de hanche", back: "Mouvement dans le plan sagittal qui réduit l'angle entre la cuisse et le tronc." },
                    { front: "Rotation Médiale (RM)", back: "Mouvement dans le plan horizontal où la face antérieure du membre regarde vers l'intérieur." },
                    { front: "Voûte plantaire", back: "La structure arquée sous le pied qui agit comme un amortisseur." }
                ],
                qcms: [
                    {
                        question: "Dans la nomenclature des plans et des axes, si on observe un mouvement de flexion/extension strict (comme un squat), dans quel plan et autour de quel axe le mouvement se déroule-t-il ?",
                        options: ["Plan frontal, axe antéropostérieur.", "Plan sagittal, axe transversal.", "Plan transversal, axe longitudinal."],
                        correct: 1,
                        explanation: "Le mouvement de Flexion / Extension s'effectue toujours dans le plan sagittal (la vue de profil) et s'articule autour d'un axe transversal."
                    },
                    {
                        question: "Lors d'un atterrissage lourd, le sacrum effectue un mouvement de contre-nutation. Quelle en est la conséquence anatomique sur le bassin ?",
                        options: ["Le diamètre du détroit supérieur diminue.", "Les ailes iliaques se rapprochent.", "Le diamètre du détroit supérieur augmente."],
                        correct: 2,
                        explanation: "La contre-nutation est le mouvement inverse de la nutation. Le sacrum bascule en arrière et en haut. En conséquence, les ailes iliaques s'éloignent."
                    },
                    {
                        question: "Lequel de ces muscles est un moteur principal de la flexion de hanche ?",
                        options: ["Le grand glutéal (grand fessier).", "Le droit du fémur.", "Le piriforme."],
                        correct: 1,
                        explanation: "Le muscle droit du fémur est l'un des moteurs principaux de la flexion de hanche, avec l'ilio-psoas, le sartorius et le TFL."
                    },
                    {
                        question: "Quel muscle profond de la jambe réalise à la fois une flexion et une rotation médiale (RM) du genou ?",
                        options: ["Le muscle tibial postérieur.", "Le muscle poplité.", "Le muscle plantaire."],
                        correct: 1,
                        explanation: "Le muscle poplité est le seul à agir directement sur le genou en effectuant une flexion couplée à une rotation médiale (RM)."
                    }
                ],
                schemas: [
                    {
                        titre: "Os coxal (vue antérieure)",
                        imageUrl: "images/1.png",
                        legendes: [
                            { numero: 1, reponsesValides: ["crête iliaque"] },
                            { numero: 2, reponsesValides: ["fosse iliaque"] },
                            { numero: 3, reponsesValides: ["épine iliaque antéro-sup", "épine iliaque antéro-supérieure"] },
                            { numero: 4, reponsesValides: ["épine iliaque antéro-inf", "épine iliaque antéro-inférieure"] },
                            { numero: 5, reponsesValides: ["acétabulum"] },
                            { numero: 6, reponsesValides: ["fémur"] }
                        ]
                    }
                ]
            },
            physiologie: {
                nom: "Physiologie", icon: "fa-heartbeat", couleur: "text-pink-500",
                flashcards: [
                    { front: "Homéostasie", back: "Capacité d’un organisme à maintenir son environnement interne stable." }
                ],
                qcms: [
                    {
                        question: "Lors d'un exercice, quelle proportion de l'énergie chimique est transformée en chaleur endogène (énergie thermique) ?",
                        options: ["25%", "50%", "75%", "100%"],
                        correct: 2,
                        explanation: "Le principe de la thermodynamique stipule que 100% d'NRJ Chimique = 25% NRJ mécanique + 75% NRJ thermique (chaleur endogène)."
                    },
                    {
                        question: "Quel processus d'échange de chaleur représente environ 80% des pertes thermiques lors d'un exercice physique ?",
                        options: ["Le rayonnement", "La conduction", "La convection", "L'évaporation"],
                        correct: 3,
                        explanation: "En exercice près de 80% des pertes de chaleurs sont dues à l’évaporation (sudation)."
                    },
                    {
                        question: "Combien de fois l'échange de chaleur par convection est-il plus important dans l'eau que dans l'air ?",
                        options: ["5 fois", "10 fois", "25 fois", "50 fois"],
                        correct: 2,
                        explanation: "L’échange de chaleur est 25 fois plus important dans l’eau que dans l’air."
                    },
                    {
                        question: "Quel est l'effet principal d'une hygrométrie supérieure à 70% sur la performance sportive ?",
                        options: ["Elle favorise l'évaporation", "Chaque palier de 5% d'humidité enlève 5% de performance", "Elle améliore la conduction nerveuse", "Elle réduit la fréquence cardiaque"],
                        correct: 1,
                        explanation: "Pour un air sec au-delà de 70% d’humidité dans l’air, pour chaque palier supplémentaire de 5%, il faut enlever 5% de performance."
                    },
                    {
                        question: "Quelle proportion d'énergie le frisson thermique convertit-il en chaleur ?",
                        options: ["25%", "50%", "75%", "100%"],
                        correct: 3,
                        explanation: "Le frisson thermique convertit 100% d’énergie chimique en énergie thermique pour réchauffer l'organisme."
                    },
                    {
                        question: "Pourquoi la performance baisse-t-elle fortement dans un milieu chaud au niveau cardio-vasculaire ?",
                        options: ["Le sang devient trop visqueux", "Le cœur ralentit par sécurité", "L'organisme privilégie la vasodilatation cutanée au détriment des muscles"],
                        correct: 2,
                        explanation: "Le système circulatoire donne la priorité à la thermorégulation, créant une vasodilatation cutanée au détriment des muscles actifs."
                    },
                    {
                        question: "La méthode d'entraînement LHTL consiste à :",
                        options: ["Vivre à 2500m et s'entraîner à 2500m", "Vivre à 2500m et s'entraîner à moins de 1500m", "Vivre en plaine et s'entraîner à 2500m"],
                        correct: 1,
                        explanation: "LHTL = S’entraîner bas et vivre haut. On vit entre 2000m et 3000m et on s'entraîne à une altitude inférieure à 1500m."
                    },
                    {
                        question: "Quelle est la résistance du tendon par rapport au muscle ?",
                        options: ["Égale", "2 fois supérieure", "4 fois supérieure"],
                        correct: 2,
                        explanation: "La résistance du tendon est bien supérieure au muscle (avec le tendon 4x supérieur au muscle)."
                    },
                    {
                        question: "Comment nomme-t-on la membrane qui entoure un faisceau musculaire ?",
                        options: ["Épimysium", "Endomysium", "Périmysium"],
                        correct: 2,
                        explanation: "Le périmysium correspond à la membrane qui entoure un faisceau musculaire."
                    },
                    {
                        question: "Quelles sont les caractéristiques des fibres de Type I (Lentes) ?",
                        options: ["Métabolisme anaérobie, forte puissance, grande taille", "Métabolisme aérobie, riches en mitochondries, innervées par de petits motoneurones", "Pauvres en mitochondries, forte fatigabilité"],
                        correct: 1,
                        explanation: "Les fibres lentes (Type I) sont riches en glycogène et en enzymes du métabolisme aérobie (mitochondries ++)."
                    },
                    {
                        question: "Dans le sarcomère, quel élément masque initialement le site actif de l'actine ?",
                        options: ["La myosine", "Le Calcium", "La troponine"],
                        correct: 2,
                        explanation: "Le site actif de réception sur l'actine est masqué par la troponine."
                    },
                    {
                        question: "Quelle enzyme présente sur la tête de myosine permet l'hydrolyse de l'ATP ?",
                        options: ["La myokinase", "La myosine ATPase", "La créatine phosphokinase"],
                        correct: 1,
                        explanation: "La myosine ATPase permet l’hydrolyse de l’ATP."
                    }
                ],
                schemas: []
            },
            sociologie: { nom: "Sociologie", icon: "fa-users", couleur: "text-blue-500", flashcards: [], qcms: [], schemas: [] },
            athletisme: { nom: "Athlétisme", icon: "fa-running", couleur: "text-orange-500", flashcards: [], qcms: [], schemas: [] },
            cirque: { nom: "Cirque", icon: "fa-tent", couleur: "text-purple-500", flashcards: [], qcms: [], schemas: [] },
            natation: { nom: "Natation", icon: "fa-person-swimming", couleur: "text-cyan-500", flashcards: [], qcms: [], schemas: [] }
        };

        let matiereActive = null;
        let indexSchemaActif = 0;
        let reponsesSchemaAffichees = false;

        // ==========================================
        // LOGIQUE D'AFFICHAGE ET DE NAVIGATION
        // ==========================================
        function genererDashboard() {
            const grille = document.getElementById('grille-matieres');
            grille.innerHTML = '';
            for (const [cle, matiere] of Object.entries(appData)) {
                const carte = document.createElement('div');
                carte.className = "bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 cursor-pointer hover:shadow-md hover:-translate-y-1 transition-all duration-300 flex flex-col items-center text-center group";
                carte.onclick = () => ouvrirMatiere(cle);
                carte.innerHTML = `
                    <div class="w-16 h-16 rounded-full bg-gray-50 dark:bg-gray-700 flex items-center justify-center mb-4 group-hover:bg-indigo-50 dark:group-hover:bg-gray-600 transition-colors">
                        <i class="fa-solid ${matiere.icon} text-3xl ${matiere.couleur}"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 dark:text-white">${matiere.nom}</h3>
                `;
                grille.appendChild(carte);
            }
        }

        function afficherDashboard() {
            document.getElementById('vue-dashboard').classList.remove('hidden');
            document.getElementById('vue-matiere').classList.add('hidden');
            document.getElementById('btn-retour').classList.add('hidden');
            matiereActive = null;
        }

        function ouvrirMatiere(cle) {
            matiereActive = cle;
            const matiere = appData[cle];
            
            document.getElementById('matiere-titre').textContent = matiere.nom;
            document.getElementById('matiere-icon').className = `fa-solid ${matiere.icon} text-4xl ${matiere.couleur}`;
            
            document.getElementById('vue-dashboard').classList.add('hidden');
            document.getElementById('vue-matiere').classList.remove('hidden');
            document.getElementById('btn-retour').classList.remove('hidden');
            
            changerOnglet('apprentissage');
            chargerContenuMatiere();
        }

        function changerOnglet(onglet) {
            const btnApp = document.getElementById('onglet-apprentissage');
            const btnEval = document.getElementById('onglet-evaluation');
            const contApp = document.getElementById('contenu-apprentissage');
            const contEval = document.getElementById('contenu-evaluation');

            if (onglet === 'apprentissage') {
                btnApp.className = "tab-active px-6 py-3 text-lg transition-colors duration-200 focus:outline-none whitespace-nowrap";
                btnEval.className = "tab-inactive px-6 py-3 text-lg transition-colors duration-200 focus:outline-none whitespace-nowrap";
                contApp.classList.remove('hidden');
                contEval.classList.add('hidden');
            } else {
                btnEval.className = "tab-active px-6 py-3 text-lg transition-colors duration-200 focus:outline-none whitespace-nowrap";
                btnApp.className = "tab-inactive px-6 py-3 text-lg transition-colors duration-200 focus:outline-none whitespace-nowrap";
                contEval.classList.remove('hidden');
                contApp.classList.add('hidden');
                initialiserSelectSchemas();
                chargerSchema();
            }
        }

        // ==========================================
        // GESTION DU CONTENU (Flashcards & QCM)
        // ==========================================
        function chargerContenuMatiere() {
            const matiere = appData[matiereActive];
            
            // Flashcards
            const containerFlashcards = document.getElementById('container-flashcards');
            if (!matiere.flashcards || matiere.flashcards.length === 0) {
                containerFlashcards.innerHTML = "<p class='italic text-gray-400'>Aucune flashcard pour le moment.</p>";
            } else {
                let htmlFlashcards = '<div class="space-y-3">';
                matiere.flashcards.forEach((carte) => {
                    htmlFlashcards += `
                    <div class="bg-gray-50 dark:bg-gray-900 p-4 rounded-xl border border-gray-200 dark:border-gray-700 cursor-pointer hover:bg-indigo-50 dark:hover:bg-gray-700 hover:border-indigo-200 transition" onclick="this.querySelector('.reponse').classList.toggle('hidden')">
                        <div class="font-bold text-gray-800 dark:text-gray-200 flex justify-between items-center">
                            <span>${carte.front}</span>
                            <i class="fa-solid fa-chevron-down text-gray-400"></i>
                        </div>
                        <div class="reponse hidden mt-3 pt-3 border-t border-gray-200 dark:border-gray-700 text-indigo-700 dark:text-indigo-400 font-medium leading-relaxed">
                            ${carte.back}
                        </div>
                    </div>`;
                });
                htmlFlashcards += '</div>';
                containerFlashcards.innerHTML = htmlFlashcards;
            }

            // QCM - Afficher l'écran d'accueil du mode QCM
            const containerQcms = document.getElementById('container-qcms');
            if (!matiere.qcms || matiere.qcms.length === 0) {
                containerQcms.innerHTML = "<p class='italic text-gray-400'>Aucun QCM pour le moment.</p>";
            } else {
                afficherAccueilQCM(matiere);
            }
        }

        // --- NOUVELLES FONCTIONS POUR LE MODE QCM 10 QUESTIONS ---

        function afficherAccueilQCM(matiere) {
            const containerQcms = document.getElementById('container-qcms');
            containerQcms.innerHTML = `
                <div class="text-center py-10 bg-gray-50 dark:bg-gray-900 rounded-xl border-2 border-dashed border-gray-200 dark:border-gray-700">
                    <i class="fa-solid fa-list-ol text-5xl text-indigo-400 dark:text-indigo-600 mb-4"></i>
                    <h4 class="text-xl font-bold text-gray-800 dark:text-white mb-2">Mode Entraînement</h4>
                    <p class="mb-6 text-gray-600 dark:text-gray-400">Cette matière contient <strong>${matiere.qcms.length}</strong> questions dans la base de données.</p>
                    
                    <button onclick="lancerSerieQCM(10)" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition shadow-md flex justify-center items-center gap-2 mx-auto w-full max-w-sm mb-4">
                        <i class="fa-solid fa-play"></i> Lancer 10 questions aléatoires
                    </button>
                    
                    <button onclick="lancerSerieQCM(${matiere.qcms.length})" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 font-medium text-sm transition">
                        Ou afficher toutes les questions d'un coup
                    </button>
                </div>
            `;
        }

        function lancerSerieQCM(nombreDeQuestions) {
            const matiere = appData[matiereActive];
            const containerQcms = document.getElementById('container-qcms');
            
            // 1. Mélanger toutes les questions de la matière
            let qcmsMelanges = [...matiere.qcms].sort(() => 0.5 - Math.random());
            
            // 2. Sélectionner seulement le nombre demandé (max 10)
            let qcmsSelectionnes = qcmsMelanges.slice(0, nombreDeQuestions);
            
            // 3. Générer le HTML pour ces questions
            let htmlQcms = '<div class="space-y-6">';
            
            htmlQcms += `
                <div class="flex items-center justify-between mb-2">
                    <span class="bg-indigo-100 text-indigo-800 dark:bg-indigo-900 dark:text-indigo-200 text-sm font-bold px-3 py-1 rounded-lg">Série en cours : ${qcmsSelectionnes.length} questions</span>
                </div>
            `;

            qcmsSelectionnes.forEach((qcm, indexQcm) => {
                htmlQcms += `
                <div class="bg-gray-50 dark:bg-gray-900 p-5 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm">
                    <p class="font-bold text-gray-800 dark:text-gray-200 mb-4 text-lg">${indexQcm + 1}. ${qcm.question}</p>
                    <div class="space-y-2">`;
                
                qcm.options.forEach((opt, indexOpt) => {
                    const explicationEscaped = qcm.explanation.replace(/'/g, "\\'");
                    htmlQcms += `
                        <button onclick="verifierQCM(this, ${qcm.correct === indexOpt}, '${explicationEscaped}')" 
                                class="w-full text-left px-5 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-700 hover:bg-indigo-50 dark:hover:bg-gray-800 hover:border-indigo-300 transition bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-medium">
                            ${opt}
                        </button>`;
                });
                
                htmlQcms += `
                    </div>
                    <div class="explication hidden mt-4 p-4 bg-blue-50 dark:bg-blue-900/30 border border-blue-100 dark:border-blue-800 text-blue-800 dark:text-blue-300 rounded-xl text-sm leading-relaxed"></div>
                </div>`;
            });
            
            // Bouton pour terminer la série et revenir à l'écran d'accueil QCM
            htmlQcms += `
                <div class="pt-6 mt-6 border-t border-gray-200 dark:border-gray-700 text-center">
                    <button onclick="afficherAccueilQCM(appData[matiereActive])" class="bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 font-bold py-3 px-6 rounded-xl transition shadow-sm flex justify-center items-center gap-2 mx-auto">
                        <i class="fa-solid fa-rotate-right"></i> Terminer et relancer une série
                    </button>
                </div>
            `;
            htmlQcms += '</div>';
            
            // 4. Injecter dans le conteneur
            containerQcms.innerHTML = htmlQcms;
        }

        function verifierQCM(btnElement, isCorrect, explication) {
            const parent = btnElement.parentElement;
            const boutons = parent.querySelectorAll('button');
            
            boutons.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:bg-indigo-50', 'hover:border-indigo-300', 'cursor-pointer');
                b.classList.add('opacity-60', 'cursor-not-allowed');
            });

            btnElement.classList.remove('opacity-60', 'border-gray-200', 'dark:border-gray-700');
            if (isCorrect) {
                btnElement.classList.add('bg-green-100', 'dark:bg-green-900/40', 'border-green-500', 'text-green-900', 'dark:text-green-300', 'font-bold');
                btnElement.innerHTML = '<i class="fa-solid fa-check mr-2"></i> ' + btnElement.innerHTML;
            } else {
                btnElement.classList.add('bg-red-100', 'dark:bg-red-900/40', 'border-red-400', 'text-red-900', 'dark:text-red-300');
                btnElement.innerHTML = '<i class="fa-solid fa-xmark mr-2"></i> ' + btnElement.innerHTML;
            }

            const explicationDiv = parent.nextElementSibling;
            explicationDiv.innerHTML = `<strong><i class="fa-solid fa-lightbulb text-yellow-500 mr-2"></i>Explication :</strong> ${explication}`;
            explicationDiv.classList.remove('hidden');
        }

        // ==========================================
        // GESTION DE L'ÉVALUATION (Schémas Numérotés)
        // ==========================================
        function initialiserSelectSchemas() {
            const schemas = appData[matiereActive].schemas;
            const select = document.getElementById('select-schema');
            select.innerHTML = '';

            if (!schemas || schemas.length === 0) {
                select.innerHTML = '<option value="">Aucun schéma disponible</option>';
                return;
            }

            schemas.forEach((schema, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = schema.titre;
                select.appendChild(option);
            });

            indexSchemaActif = 0;
            select.value = 0;
        }

        function changerSchemaActif(index) {
            indexSchemaActif = parseInt(index);
            reponsesSchemaAffichees = false;
            chargerSchema();
        }

        function toggleReponsesSchema() {
            reponsesSchemaAffichees = !reponsesSchemaAffichees;
            
            const solutions = document.querySelectorAll('.schema-solution');
            solutions.forEach(el => {
                if (reponsesSchemaAffichees) {
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            });
            
            majBoutonsReponses();
        }

        function majBoutonsReponses() {
            const texte = reponsesSchemaAffichees ? "Masquer les réponses" : "Afficher les réponses";
            const icone = reponsesSchemaAffichees ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";

            const btnBottom = document.getElementById('btn-reponses-schema');
            const txtBottom = document.getElementById('texte-btn-reponses');
            const icoBottom = document.getElementById('icone-btn-reponses');
            if (txtBottom) txtBottom.textContent = texte;
            if (icoBottom) icoBottom.className = icone;
            if (btnBottom) {
                if (reponsesSchemaAffichees) {
                    btnBottom.classList.add('bg-indigo-50', 'dark:bg-indigo-900/40');
                } else {
                    btnBottom.classList.remove('bg-indigo-50', 'dark:bg-indigo-900/40');
                }
            }

            const btnTop = document.getElementById('btn-reponses-schema-top');
            const txtTop = document.getElementById('texte-btn-reponses-top');
            const icoTop = document.getElementById('icone-btn-reponses-top');
            if (txtTop) txtTop.textContent = texte;
            if (icoTop) icoTop.className = icone;
            if (btnTop) {
                if (reponsesSchemaAffichees) {
                    btnTop.classList.add('bg-indigo-100', 'dark:bg-indigo-900/60');
                } else {
                    btnTop.classList.remove('bg-indigo-100', 'dark:bg-indigo-900/60');
                }
            }
        }

        function formaterReponsesValides(reponsesValides) {
            if (!reponsesValides || reponsesValides.length === 0) return "";
            const unique = [...new Set(reponsesValides.map(r => r.trim()))];
            const principale = unique[0];
            if (unique.length === 1) {
                return `<strong class="text-emerald-900 dark:text-emerald-300">${principale}</strong>`;
            }
            const variantes = unique.slice(1).join(', ');
            return `<strong class="text-emerald-900 dark:text-emerald-300">${principale}</strong> <span class="text-xs text-emerald-700 dark:text-emerald-400 font-normal">(ou ${variantes})</span>`;
        }

        function chargerSchema() {
            const schemas = appData[matiereActive].schemas;
            const containerLegendes = document.getElementById('schema-legendes-container');
            const imgSchema = document.getElementById('schema-image');
            const placeholder = document.getElementById('schema-placeholder');
            const btnValider = document.getElementById('btn-valider-schema');
            const btnReponses = document.getElementById('btn-reponses-schema');
            const btnReponsesTop = document.getElementById('btn-reponses-schema-top');
            const resultatDiv = document.getElementById('schema-resultat');
            
            reponsesSchemaAffichees = false;
            majBoutonsReponses();

            if (!schemas || schemas.length === 0) {
                document.getElementById('schema-titre').textContent = "Aucun schéma disponible";
                imgSchema.classList.add('hidden');
                placeholder.classList.remove('hidden');
                containerLegendes.innerHTML = "<p class='text-gray-400 italic'>Les champs de réponse apparaîtront ici.</p>";
                btnValider.classList.add('hidden');
                if (btnReponses) btnReponses.classList.add('hidden');
                if (btnReponsesTop) btnReponsesTop.classList.add('hidden');
                resultatDiv.classList.add('hidden');
                return;
            }

            const schemaData = schemas[indexSchemaActif];
            document.getElementById('schema-titre').textContent = schemaData.titre;
            
            imgSchema.src = schemaData.imageUrl;
            imgSchema.classList.remove('hidden');
            placeholder.classList.add('hidden');
            btnValider.classList.remove('hidden');
            if (btnReponses) btnReponses.classList.remove('hidden');
            if (btnReponsesTop) btnReponsesTop.classList.remove('hidden');
            resultatDiv.classList.add('hidden');
            
            containerLegendes.innerHTML = ''; 

            schemaData.legendes.forEach(legende => {
                const div = document.createElement('div');
                div.className = "flex items-start gap-3";
                const reponseAffichee = formaterReponsesValides(legende.reponsesValides);
                div.innerHTML = `
                    <div class="bg-indigo-100 dark:bg-indigo-900/50 text-indigo-800 dark:text-indigo-300 font-bold rounded-full w-8 h-8 flex items-center justify-center flex-shrink-0 shadow-sm border border-indigo-200 dark:border-indigo-800 mt-1">
                        ${legende.numero}
                    </div>
                    <div class="flex-grow">
                        <input type="text" id="reponse-${legende.numero}" 
                               class="w-full border-2 border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition" 
                               placeholder="Légende n°${legende.numero}...">
                        <div id="solution-${legende.numero}" class="schema-solution ${reponsesSchemaAffichees ? '' : 'hidden'} mt-1.5 text-sm bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-300 rounded-lg px-3 py-1.5 flex items-center justify-between gap-2 shadow-xs">
                            <div class="flex items-center gap-2 min-w-0">
                                <i class="fa-solid fa-lightbulb text-amber-500 flex-shrink-0 text-xs"></i>
                                <span class="text-xs sm:text-sm">Réponse : ${reponseAffichee}</span>
                            </div>
                            <button type="button" class="btn-remplir ml-auto text-xs bg-emerald-100 dark:bg-emerald-900/60 hover:bg-emerald-200 dark:hover:bg-emerald-900 text-emerald-800 dark:text-emerald-200 font-medium px-2 py-0.5 rounded transition flex items-center gap-1 flex-shrink-0" title="Remplir ce champ">
                                <i class="fa-solid fa-pen text-[10px]"></i> Remplir
                            </button>
                        </div>
                    </div>
                `;

                const btnRemplir = div.querySelector('.btn-remplir');
                if (btnRemplir) {
                    btnRemplir.addEventListener('click', () => {
                        const input = div.querySelector(`#reponse-${legende.numero}`);
                        if (input) {
                            input.value = legende.reponsesValides[0];
                            input.focus();
                        }
                    });
                }

                containerLegendes.appendChild(div);
            });
        }

        // ==========================================
        // OUTILS DE CORRECTION TOLÉRANTE
        // ==========================================
        function normaliserTexte(texte) {
            return texte.trim()
                        .toLowerCase()
                        .normalize("NFD")
                        .replace(/[\u0300-\u036f]/g, ""); 
        }

        function calculerFautes(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            
            const matrice = [];
            for (let i = 0; i <= b.length; i++) { matrice[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrice[0][j] = j; }
            
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrice[i][j] = matrice[i - 1][j - 1];
                    } else {
                        matrice[i][j] = Math.min(
                            matrice[i - 1][j - 1] + 1, 
                            Math.min(matrice[i][j - 1] + 1, 
                                     matrice[i - 1][j] + 1) 
                        );
                    }
                }
            }
            return matrice[b.length][a.length];
        }

        function validerSchema() {
            const schemaData = appData[matiereActive].schemas[indexSchemaActif];
            if(!schemaData) return;
            
            let score = 0;

            schemaData.legendes.forEach(legende => {
                const inputElement = document.getElementById(`reponse-${legende.numero}`);
                const reponseUser = inputElement.value;
                const reponseUserNorm = normaliserTexte(reponseUser);
                
                const estCorrect = legende.reponsesValides.some(rep => {
                    const repNorm = normaliserTexte(rep);
                    if (repNorm === reponseUserNorm) return true;
                    const nombreFautes = calculerFautes(repNorm, reponseUserNorm);
                    const tolerance = repNorm.length > 6 ? 2 : 1;
                    return nombreFautes <= tolerance;
                });
                
                if (estCorrect) {
                    inputElement.classList.remove('border-gray-200', 'dark:border-gray-700', 'border-red-400', 'bg-red-50', 'text-red-800');
                    inputElement.classList.add('border-green-500', 'bg-green-50', 'dark:bg-green-900/30', 'text-green-800', 'dark:text-green-300', 'font-medium');
                    score++;
                } else {
                    inputElement.classList.remove('border-gray-200', 'dark:border-gray-700', 'border-green-500', 'bg-green-50', 'text-green-800');
                    inputElement.classList.add('border-red-400', 'bg-red-50', 'dark:bg-red-900/30', 'text-red-800', 'dark:text-red-300');
                }
            });

            const resultatDiv = document.getElementById('schema-resultat');
            resultatDiv.classList.remove('hidden', 'bg-green-100', 'dark:bg-green-900/50', 'text-green-800', 'dark:text-green-300', 'bg-orange-100', 'dark:bg-orange-900/50', 'text-orange-800', 'dark:text-orange-300');
            
            if(score === schemaData.legendes.length) {
                resultatDiv.classList.add('bg-green-100', 'dark:bg-green-900/50', 'text-green-800', 'dark:text-green-300');
                resultatDiv.innerHTML = `<i class="fa-solid fa-trophy mr-2"></i> Parfait ! Vous avez ${score}/${schemaData.legendes.length} bonnes réponses.`;
            } else {
                resultatDiv.classList.add('bg-orange-100', 'dark:bg-orange-900/50', 'text-orange-800', 'dark:text-orange-300');
                resultatDiv.innerHTML = `
                    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
                        <span><i class="fa-solid fa-triangle-exclamation mr-2"></i> Vous avez ${score}/${schemaData.legendes.length}. Corrigez les cases rouges ou vérifiez les solutions !</span>
                        <button onclick="if(!reponsesSchemaAffichees) toggleReponsesSchema()" class="text-sm bg-orange-200 dark:bg-orange-900/60 hover:bg-orange-300 dark:hover:bg-orange-900 text-orange-900 dark:text-orange-200 font-bold px-3 py-1.5 rounded-lg transition whitespace-nowrap flex items-center gap-1.5">
                            <i class="fa-solid fa-eye text-xs"></i> Voir les réponses
                        </button>
                    </div>
                `;
            }
        }
    </script>
