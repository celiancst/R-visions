<html lang="fr" class="">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: bold; }
        .tab-inactive { color: #6b7280; }
        .tab-inactive:hover { color: #374151; }
        html.dark .tab-active { border-bottom: 4px solid #818cf8; color: #818cf8; }
        html.dark .tab-inactive { color: #9ca3af; }
        html.dark .tab-inactive:hover { color: #e5e7eb; }
    </style>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-screen flex flex-col transition-colors duration-300">

    <!-- EN-TÊTE -->
    <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-10 transition-colors duration-300">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800 dark:text-white">STAPS <span class="text-indigo-600 dark:text-indigo-400">Révisions</span></h1>
            </div>
            
            <div class="flex items-center gap-4">
                <button id="btn-retour" onclick="afficherDashboard()" class="hidden flex items-center gap-2 text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium transition">
                    <i class="fa-solid fa-arrow-left"></i> Retour aux matières
                </button>
                
                <!-- BOUTON MODE SOMBRE -->
                <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-yellow-400 hover:bg-gray-200 dark:hover:bg-gray-600 transition shadow-sm" title="Changer de mode">
                    <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENU PRINCIPAL -->
    <main class="flex-grow overflow-y-auto p-4 md:p-8 max-w-6xl mx-auto w-full">

        <!-- VUE 1 : DASHBOARD -->
        <div id="vue-dashboard" class="block">
            <h2 class="text-xl text-gray-500 dark:text-gray-400 mb-6 font-medium">Choisissez une matière à réviser :</h2>
            <div id="grille-matieres" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
        </div>

        <!-- VUE 2 : MATIÈRE -->
        <div id="vue-matiere" class="hidden">
            
            <div class="flex items-center gap-4 mb-8">
                <i id="matiere-icon" class="fa-solid fa-book text-4xl"></i>
                <h2 id="matiere-titre" class="text-3xl font-bold capitalize">Titre Matière</h2>
            </div>

            <!-- ONGLETS -->
            <div class="flex border-b border-gray-200 dark:border-gray-700 mb-8 overflow-x-auto">
                <button onclick="changerOnglet('apprentissage')" id="onglet-apprentissage" class="tab-active px-6 py-3 text-lg transition-colors duration-200 focus:outline-none whitespace-nowrap">
                    <i class="fa-solid fa-book-open mr-2"></i> Apprentissage
                </button>
                <button onclick="changerOnglet('evaluation')" id="onglet-evaluation" class="tab-inactive px-6 py-3 text-lg transition-colors duration-200 focus:outline-none whitespace-nowrap">
                    <i class="fa-solid fa-pen-to-square mr-2"></i> Évaluation (Schémas)
                </button>
            </div>

            <!-- ONGLET 1 : APPRENTISSAGE -->
            <div id="contenu-apprentissage" class="block">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Flashcards -->
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 transition-colors">
                        <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-clone text-indigo-500"></i> Lexique & Flashcards</h3>
                        <div id="container-flashcards" class="text-gray-500 dark:text-gray-400 italic"></div>
                    </div>
                    <!-- QCM -->
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 transition-colors">
                        <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-list-check text-indigo-500"></i> QCM d'entraînement</h3>
                        <div id="container-qcms" class="text-gray-500 dark:text-gray-400 italic"></div>
                    </div>
                </div>
            </div>

            <!-- ONGLET 2 : ÉVALUATION (Schémas Numérotés) -->
            <div id="contenu-evaluation" class="hidden">
                
                <!-- SÉLECTEUR DE SCHÉMA -->
                <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 transition-colors">
                    <label for="select-schema" class="font-bold text-gray-700 dark:text-gray-300 flex items-center gap-2">
                        <i class="fa-solid fa-filter text-indigo-600 dark:text-indigo-400"></i> Choisir le schéma :
                    </label>
                    <select id="select-schema" onchange="changerSchemaActif(this.value)" class="w-full sm:w-2/3 border-2 border-gray-200 dark:border-gray-700 rounded-xl px-4 py-2 font-medium text-gray-700 dark:text-gray-200 bg-gray-50 dark:bg-gray-900 focus:outline-none focus:border-indigo-500 transition">
                    </select>
                </div>

                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 transition-colors">
                    <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-4" id="schema-titre">Titre du schéma</h3>
                    
                    <div class="flex flex-col md:flex-row gap-8">
                        <!-- Zone Image -->
                        <div class="md:w-1/2 flex justify-center items-start border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-xl p-2 bg-gray-50 dark:bg-gray-900 min-h-[300px]">
                            <img id="schema-image" src="" alt="Schéma" class="max-w-full h-auto rounded-lg shadow-sm hidden">
                            <div id="schema-placeholder" class="text-gray-400 flex flex-col items-center justify-center h-full w-full py-20">
                                <i class="fa-regular fa-image text-4xl mb-2"></i>
                                <span>Aucun schéma pour le moment</span>
                            </div>
                        </div>
                        
                        <!-- Zone des réponses numérotées -->
                        <div class="md:w-1/2">
                            <p class="text-gray-500 dark:text-gray-400 mb-4 text-sm"><i class="fa-solid fa-circle-info mr-2"></i>Remplissez les légendes correspondant aux numéros sur le schéma.</p>
                            
                            <div id="schema-legendes-container" class="space-y-3 mb-6"></div>
                            
                            <div class="flex flex-col sm:flex-row gap-3">
                                <button onclick="validerSchema()" id="btn-valider-schema" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-md flex justify-center items-center gap-2 hidden">
                                    <i class="fa-solid fa-check-circle"></i> Valider mes réponses
                                </button>

                                    <i class="fa-solid fa-eye text-indigo-600 dark:text-indigo-400"></i> Afficher les réponses
                                </button>
                            </div>
                            <div id="schema-resultat" class="mt-4 text-center font-bold text-lg hidden p-3 rounded-lg"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

        // ==========================================
        // GESTION DU MODE SOMBRE
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').className = "fa-solid fa-sun text-lg";
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').className = "fa-solid fa-moon text-lg";
            }
            genererDashboard();
            afficherDashboard();
        });

        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                icon.className = "fa-solid fa-moon text-lg";
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                icon.className = "fa-solid fa-sun text-lg";

        // ==========================================
        // OUTILS DE CORRECTION TOLÉRANTE
        // ==========================================
        function normaliserTexte(texte) {
            return texte.trim()
                        .toLowerCase()
                        .normalize("NFD")
                        .replace(/[\u0300-\u036f]/g, ""); 
        }

        function calculerFautes(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            
            const matrice = [];
            for (let i = 0; i <= b.length; i++) { matrice[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrice[0][j] = j; }
            
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrice[i][j] = matrice[i - 1][j - 1];
                    } else {
                        matrice[i][j] = Math.min(
                            matrice[i - 1][j - 1] + 1, 
                            Math.min(matrice[i][j - 1] + 1, 
                                     matrice[i - 1][j] + 1) 
                        );
                    }
                }
            }
            return matrice[b.length][a.length];
        }

        function validerSchema() {
            const schemaData = appData[matiereActive].schemas[indexSchemaActif];
            if(!schemaData) return;
            
            let score = 0;

            schemaData.legendes.forEach(legende => {
                const inputElement = document.getElementById(`reponse-${legende.numero}`);
                const reponseUser = inputElement.value;
                const reponseUserNorm = normaliserTexte(reponseUser);
                
                const estCorrect = legende.reponsesValides.some(rep => {
                    const repNorm = normaliserTexte(rep);
                    if (repNorm === reponseUserNorm) return true;
                    const nombreFautes = calculerFautes(repNorm, reponseUserNorm);
                    const tolerance = repNorm.length > 6 ? 2 : 1;
                    return nombreFautes <= tolerance;
                });
                
                if (estCorrect) {
                    inputElement.classList.remove('border-gray-200', 'dark:border-gray-700', 'border-red-400', 'bg-red-50', 'text-red-800');
                    inputElement.classList.add('border-green-500', 'bg-green-50', 'dark:bg-green-900/30', 'text-green-800', 'dark:text-green-300', 'font-medium');
                    score++;
                } else {
                    inputElement.classList.remove('border-gray-200', 'dark:border-gray-700', 'border-green-500', 'bg-green-50', 'text-green-800');
                    inputElement.classList.add('border-red-400', 'bg-red-50', 'dark:bg-red-900/30', 'text-red-800', 'dark:text-red-300');
                }
            });

            const resultatDiv = document.getElementById('schema-resultat');
            resultatDiv.classList.remove('hidden', 'bg-green-100', 'dark:bg-green-900/50', 'text-green-800', 'dark:text-green-300', 'bg-orange-100', 'dark:bg-orange-900/50', 'text-orange-800', 'dark:text-orange-300');
            
            if(score === schemaData.legendes.length) {
                resultatDiv.classList.add('bg-green-100', 'dark:bg-green-900/50', 'text-green-800', 'dark:text-green-300');
                resultatDiv.innerHTML = `<i class="fa-solid fa-trophy mr-2"></i> Parfait ! Vous avez ${score}/${schemaData.legendes.length} bonnes réponses.`;
            } else {
                resultatDiv.classList.add('bg-orange-100', 'dark:bg-orange-900/50', 'text-orange-800', 'dark:text-orange-300');
                resultatDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> Vous avez ${score}/${schemaData.legendes.length}. Corrigez les cases rouges et validez à nouveau !`;
            }
        }

        function afficherReponses() {
            const schemaData = appData[matiereActive].schemas[indexSchemaActif];

            schemaData.legendes.forEach(legende => {
                const inputElement = document.getElementById(`reponse-${legende.numero}`);
                inputElement.value = legende.reponsesValides[0];
                
                inputElement.classList.remove('border-red-400', 'bg-red-50', 'text-red-800', 'border-green-500', 'bg-green-50', 'text-green-800', 'dark:bg-red-900/30', 'dark:bg-green-900/30');
                inputElement.classList.add('border-blue-300', 'bg-blue-50', 'dark:bg-blue-900/30', 'text-blue-900', 'dark:text-blue-200', 'font-medium');
            });

            const resultatDiv = document.getElementById('schema-resultat');
            resultatDiv.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-orange-100', 'text-orange-800', 'dark:bg-green-900/50', 'dark:bg-orange-900/50');
            resultatDiv.classList.add('bg-blue-100', 'dark:bg-blue-900/50', 'text-blue-900', 'dark:text-blue-200');
            resultatDiv.innerHTML = `<i class="fa-solid fa-eye mr-2"></i> Les réponses officielles ont été affichées.`;
        }
    </script>
</body>
</html>
